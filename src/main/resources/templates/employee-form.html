<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulár Zamestnanca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Formulár Zamestnanca</h2>

    <form th:action="@{/employees/save}" th:object="${employee}" method="POST" class="w-50">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Meno</label>
            <input type="text" th:field="*{firstName}" class="form-control" placeholder="Meno">
            <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="text-danger"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Priezvisko</label>
            <input type="text" th:field="*{lastName}" class="form-control" placeholder="Priezvisko">
            <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Dátum narodenia</label>
            <input type="date" th:field="*{birthDate}" class="form-control">
            <span th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}" class="text-danger"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control" placeholder="Email">
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Telefón</label>
            <input type="text" th:field="*{phone}" class="form-control" placeholder="Telefón">
            <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Plat</label>
            <input type="number" th:field="*{salary}" class="form-control" placeholder="Plat">
            <span th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}" class="text-danger"></span>
        </div>

        <!-- Dynamický Drop-down pre Job Title -->
        <div class="mb-3">
            <label class="form-label">Pracovná pozícia</label>
            <select th:field="*{jobTitle}" class="form-select">
                <option value="" disabled selected>Vyberte pozíciu...</option>
                <option th:each="job : ${jobTitles}" th:value="${job}" th:text="${job}"></option>
            </select>
            <span th:if="${#fields.hasErrors('jobTitle')}" th:errors="*{jobTitle}" class="text-danger"></span>
        </div>

        <!-- Dynamické Radio buttons pre Employment Type -->
        <div class="mb-3">
            <label class="form-label d-block">Typ úväzku</label>
            <div th:each="type : ${employmentTypes}" class="form-check form-check-inline">
                <input class="form-check-input" type="radio" th:field="*{fullTime}" th:value="${type.key}">
                <label class="form-check-label" th:text="${type.value}"></label>
            </div>
            <div th:if="${#fields.hasErrors('fullTime')}" th:errors="*{fullTime}" class="text-danger"></div>
        </div>

        <button type="submit" class="btn btn-success">Uložiť</button>
        <a th:href="@{/employees/list}" class="btn btn-secondary">Späť na zoznam</a>
    </form>
</div>
</body>
</html>
