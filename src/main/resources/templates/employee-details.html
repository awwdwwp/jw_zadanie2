<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detail Zamestnanca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card w-50">
        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Detail Zamestnanca</h3>
        </div>
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${employee.id}"></span></p>
            <p><strong>Meno:</strong> <span th:text="${employee.firstName}"></span></p>
            <p><strong>Priezvisko:</strong> <span th:text="${employee.lastName}"></span></p>
            <p><strong>Dátum narodenia:</strong> <span th:text="${employee.birthDate}"></span></p>
            <p><strong>Email:</strong> <span th:text="${employee.email}"></span></p>
            <p><strong>Telefón:</strong> <span th:text="${employee.phone}"></span></p>
            <p><strong>Pozícia:</strong> <span th:text="${employee.jobTitle}"></span></p>
            <p><strong>Plat:</strong> <span th:text="${employee.salary} + ' €'"></span></p>
            <p><strong>Typ úväzku:</strong> <span th:text="${employmentTypeStr}"></span></p>
        </div>
        <div class="card-footer">
            <a th:href="@{/employees/list}" class="btn btn-primary">Späť na zoznam</a>
            <a th:href="@{/employees/showFormForUpdate(employeeId=${employee.id})}" class="btn btn-warning">Upraviť</a>
        </div>
    </div>
</div>
</body>
</html>
