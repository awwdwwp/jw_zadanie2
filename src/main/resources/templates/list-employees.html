<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adresár Zamestnancov</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Adresár Zamestnancov</h2>
    <a th:href="@{/employees/showFormForAdd}" class="btn btn-primary mb-3">Pridať zamestnanca</a>

    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Meno</th>
            <th>Priezvisko</th>
            <th>Pozícia</th>
            <th>Úväzok</th>
            <th>Akcie</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempEmployee : ${employees}">
            <td th:text="${tempEmployee.firstName}"></td>
            <td th:text="${tempEmployee.lastName}"></td>
            <td th:text="${tempEmployee.jobTitle}"></td>
            <td th:text="${employmentTypes.get(tempEmployee.fullTime)}"></td>
            <td>
                <a th:href="@{/employees/details(employeeId=${tempEmployee.id})}" class="btn btn-info btn-sm">Detail</a>
                <a th:href="@{/employees/showFormForUpdate(employeeId=${tempEmployee.id})}" class="btn btn-warning btn-sm">Upraviť</a>
                <a th:href="@{/employees/delete(employeeId=${tempEmployee.id})}" class="btn btn-danger btn-sm" onclick="if (!(confirm('Ste si istý, že chcete vymazať tohto zamestnanca?'))) return false">Vymazať</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
